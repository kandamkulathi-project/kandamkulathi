name: Application
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      EXPO_NO_TELEMETRY: '1'
      ASTRO_TELEMETRY_DISABLED: '1'
      PLATFORM_TEST_ADMIN_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
      PG_BIN_DIR: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, typecheck, boundary tests, web/native exports and Worker dry builds
        run: pnpm verify
      - name: Verify Expo dependency and public configuration compatibility
        run: pnpm mobile:check
      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser and actual local workerd smoke tests
        run: pnpm exec playwright test
      - name: Ensure matching PostgreSQL client tools
        run: |
          if [ ! -x "$PG_BIN_DIR/pg_dump" ]; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client-17
          fi
          "$PG_BIN_DIR/pg_dump" --version
          "$PG_BIN_DIR/pg_restore" --version
      - name: Real PostgreSQL roles, transactions, leases, encrypted recovery and Cron/Queue E2E
        run: pnpm test:platform
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test fail-closed security verification policy
        run: pnpm test:security
      - name: Verify actual patch sources, exploits and full registry audit
        run: pnpm security:check
      - name: Retain unmodified registry findings for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: test-results/dependency-audit.json
          retention-days: 7
          if-no-files-found: warn
