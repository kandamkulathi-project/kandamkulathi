name: Documentation
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pinned documentation Python series
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
      - name: Check documentation, traceability and application CI wiring
        run: python scripts/check_repository.py
      - name: Test documentation guard negative controls
        run: python -m unittest discover -s tests/repository -v
